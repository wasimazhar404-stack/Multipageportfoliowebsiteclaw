name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify secrets exist
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PATH_REMOTE: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          if [ -z "$SSH_KEY" ]; then echo "❌ HOSTINGER_SSH_KEY is missing"; exit 1; fi
          if [ -z "$HOST" ]; then echo "❌ HOSTINGER_HOST is missing"; exit 1; fi
          if [ -z "$PORT" ]; then echo "❌ HOSTINGER_SSH_PORT is missing"; exit 1; fi
          if [ -z "$USER" ]; then echo "❌ HOSTINGER_USER is missing"; exit 1; fi
          if [ -z "$PATH_REMOTE" ]; then echo "❌ HOSTINGER_REMOTE_PATH is missing"; exit 1; fi
          echo "✅ All secrets are present"
        shell: bash

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          TARGET: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          SOURCE: dist/
          ARGS: -rlgoDzvc -i --delete
